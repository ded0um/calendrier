<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dégradé pour la bordure orange fine -->
    <linearGradient id="orange-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9d3b"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <!-- Dégradé pour le fond sombre -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2d32"/>
      <stop offset="100%" stop-color="#111215"/>
    </linearGradient>

    <!-- Ombre interne pour la profondeur -->
    <filter id="inner-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="4"/>
      <feGaussianBlur stdDeviation="5" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000" flood-opacity="0.6" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>





  <!-- Fond plein derrière le cercle : même couleur que le fond intérieur.
       Il couvre tout le carré pour qu'aucun lanceur ne puisse jamais afficher
       de blanc, quel que soit le masque appliqué (cercle, carré arrondi, etc.). -->
  <rect width="512" height="512" fill="#111215"/>






<!-- Groupe réduit à 78% et centré : zone sûre "maskable" de Chrome
       (le masque du lanceur peut rogner jusqu'à 10% de chaque côté) -->
  <g transform="translate(256, 256) scale(0.78) translate(-256, -256)">
  <!-- Anneau extérieur Orange (Bordure fine) -->
  <circle cx="256" cy="256" r="248" fill="url(#orange-border)"/>

  <!-- Fond intérieur sombre -->
  <circle cx="256" cy="256" r="238" fill="url(#bg-gradient)" filter="url(#inner-shadow)"/>

  <!-- Cadre principal du calendrier -->
  <rect x="116" y="90" width="280" height="270" rx="20" fill="#1e2024" stroke="#ffffff" stroke-width="12"/>

  <!-- En-tête du calendrier (Bandeau orange) -->
  <path d="M 122 110 A 10 10 0 0 1 132 100 L 380 100 A 10 10 0 0 1 390 110 L 390 160 L 122 160 Z" fill="#ff7700"/>

  <!-- Anneaux d'accroche du calendrier -->
  <rect x="176" y="75" width="16" height="40" rx="8" fill="#ffffff"/>
  <rect x="320" y="75" width="16" height="40" rx="8" fill="#ffffff"/>

  <!-- Texte du mois dans l'en-tête -->
  <text x="256" y="142" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="2">CONGÉS</text>

  <!-- Grille des jours (Cases) -->
  <!-- Ligne 1 -->
  <rect x="146" y="185" width="45" height="40" rx="6" fill="#2a2d32"/>
  <rect x="206" y="185" width="45" height="40" rx="6" fill="#2a2d32"/>
  <rect x="266" y="185" width="45" height="40" rx="6" fill="#2a2d32"/>
  <rect x="326" y="185" width="45" height="40" rx="6" fill="#ff7700"/> <!-- Case validée CP -->

  <!-- Ligne 2 -->
  <rect x="146" y="240" width="45" height="40" rx="6" fill="#2a2d32"/>
  <rect x="206" y="240" width="45" height="40" rx="6" fill="#ff7700"/> <!-- Case validée CP -->
  <rect x="266" y="240" width="45" height="40" rx="6" fill="#2a2d32"/>
  <rect x="326" y="240" width="45" height="40" rx="6" fill="#2a2d32"/>

  <!-- Ligne 3 -->
  <rect x="146" y="295" width="45" height="40" rx="6" fill="#2a2d32"/>
  <rect x="206" y="295" width="45" height="40" rx="6" fill="#2a2d32"/>
  <rect x="266" y="295" width="45" height="40" rx="6" fill="#ff7700"/> <!-- Case validée CP -->
  <rect x="326" y="295" width="45" height="40" rx="6" fill="#2a2d32"/>

  <!-- Icône de palmier / CP dans les cases oranges -->
  <text x="348" y="213" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="18" fill="#ffffff" text-anchor="middle">CP</text>
  <text x="228" y="268" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="18" fill="#ffffff" text-anchor="middle">CP</text>
  <text x="288" y="323" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="18" fill="#ffffff" text-anchor="middle">CP</text>

  <!-- Texte DEDOUM en bas -->
  <text x="256" y="435" 
        text-anchor="middle" 
        font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-weight="900" 
        font-size="50" 
        letter-spacing="4" 
        fill="#ffffff">DEDOUM</text>
</svg>
