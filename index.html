<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de Bord & Planning</title>
  <style>
    :root {
      --bg-main: #000000;
      --bg-card: #0b0b0b;
      --bg-panel: #111111;
      --bg-input: #141414;
      --accent: #ff8c00;
      --border-color: #333333;
      --text-main: #f5f5f5;
      --text-muted: #888888;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-family);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Top bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 15px 20px;
      border-radius: 8px;
    }

    .title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    /* Buttons */
    .btn-action {
      background: var(--bg-panel);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn-action:hover {
      border-color: var(--accent);
      background: #181818;
    }

    .btn-save {
      background: var(--accent);
      color: #000000;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-cancel {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Grid & Calendar Dashboard Mockup */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
    }

    .card-title {
      font-size: 1rem;
      color: var(--accent);
      margin-bottom: 15px;
      font-weight: 600;
    }

    /* Overlay & Modal Windows */
    .inspection-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .inspection-overlay.visible {
      display: flex;
    }

    .inspection-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      width: 90%;
      max-width: 520px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .inspection-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .inspection-title {
      font-weight: 700;
      font-size: 1rem;
    }

    .inspection-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .inspection-body {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .inspection-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      border-top: 1px solid var(--border-color);
      padding-top: 15px;
    }

    /* Form controls */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .inspection-notes {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px;
      border-radius: 4px;
      width: 100%;
      font-family: inherit;
    }

    .radio-group {
      display: flex;
      gap: 15px;
    }

    .radio-label {
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Barre supérieure d'actions -->
  <header class="header-bar">
    <div class="title">Tableau de Bord</div>
    <div>
      <button class="btn-action" onclick="openRobinSettings()" title="Paramètres du planning de Robin">
        ⚙️ Planning Robin
      </button>
    </div>
  </header>

  <!-- Contenu principal / Aperçu du tableau de bord -->
  <main class="dashboard-grid">
    <section class="card">
      <div class="card-title">Calendrier / Vue d'ensemble</div>
      <p style="color: var(--text-muted); font-size: 0.9rem;">
        Cliquez sur le bouton « ⚙️ Planning Robin » en haut à droite pour configurer la règle d'alternance et les périodes personnalisées.
      </p>
    </section>
  </main>

  <!-- Modale de configuration du planning de Robin -->
  <div id="robin-settings-overlay" class="inspection-overlay">
    <div class="inspection-panel">
      <div class="inspection-header">
        <span class="inspection-title">⚙️ Configuration — Planning de Robin</span>
        <button class="inspection-close" onclick="closeRobinSettings()">✕</button>
      </div>
      
      <div class="inspection-body">
        <!-- Section 1 : Règle 1 weekend sur 2 -->
        <div class="form-group" style="background: var(--bg-panel); padding: 12px; border-radius: 6px; border: 1px solid var(--border-color);">
          <label class="form-label" style="color: var(--accent); font-weight: 700; margin-bottom: 8px;">
            Alternance 1 week-end sur 2
          </label>
          
          <label class="radio-label" style="margin-bottom: 10px;">
            <input type="checkbox" id="robin-enable-alternate" onchange="toggleAlternateSettings()" checked>
            Activer la coloration automatique 1 WE / 2
          </label>

          <div id="alternate-options" class="radio-group" style="flex-direction: column; gap: 8px;">
            <span class="form-label">Colorer les week-ends des semaines :</span>
            <div style="display: flex; gap: 15px;">
              <label class="radio-label">
                <input type="radio" name="robin-parity" value="even" checked> Semaines paires
              </label>
              <label class="radio-label">
                <input type="radio" name="robin-parity" value="odd"> Semaines impaires
              </label>
            </div>
          </div>
        </div>

        <!-- Section 2 : Ajout de périodes d'exception -->
        <div class="form-group" style="background: var(--bg-panel); padding: 12px; border-radius: 6px; border: 1px solid var(--border-color);">
          <label class="form-label" style="color: var(--accent); font-weight: 700; margin-bottom: 8px;">
            Ajouter une période spécifique
          </label>

          <div style="display: flex; flex-direction: column; gap: 8px;">
            <div style="display: flex; gap: 8px;">
              <div style="flex: 1;">
                <span class="form-label">Début</span>
                <input type="date" id="period-start" class="inspection-notes" style="min-height: auto; padding: 6px;">
              </div>
              <div style="flex: 1;">
                <span class="form-label">Fin</span>
                <input type="date" id="period-end" class="inspection-notes" style="min-height: auto; padding: 6px;">
              </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
              <div class="radio-group">
                <label class="radio-label">
                  <input type="radio" name="period-type" value="presence" checked> Présence
                </label>
                <label class="radio-label">
                  <input type="radio" name="period-type" value="absence"> Absence
                </label>
              </div>
              <button type="button" class="btn-action" style="background: var(--accent); color: #000; border: none; font-weight: 600;" onclick="addRobinPeriod()">
                + Ajouter
              </button>
            </div>
          </div>
        </div>

        <!-- Section 3 : Liste des exceptions configurées -->
        <div class="form-group">
          <label class="form-label">Périodes personnalisées enregistrées :</label>
          <div id="robin-periods-list" style="display: flex; flex-direction: column; gap: 6px; max-height: 140px; overflow-y: auto;">
            <!-- Les périodes s'afficheront ici dynamiquement -->
          </div>
        </div>
      </div>

      <div class="inspection-footer">
        <button class="btn-cancel" onclick="closeRobinSettings()">Annuler</button>
        <button class="btn-save" onclick="saveRobinSettings()">Enregistrer</button>
      </div>
    </div>
  </div>

  <script>
    // Configuration globale
    let robinConfig = {
      enableAlternate: true,
      parity: 'even',
      customPeriods: []
    };

    function openRobinSettings() {
      document.getElementById('robin-settings-overlay').classList.add('visible');
      renderPeriodsList();
    }

    function closeRobinSettings() {
      document.getElementById('robin-settings-overlay').classList.remove('visible');
    }

    function toggleAlternateSettings() {
      const enabled = document.getElementById('robin-enable-alternate').checked;
      document.getElementById('alternate-options').style.opacity = enabled ? '1' : '0.4';
      document.querySelectorAll('input[name="robin-parity"]').forEach(r => r.disabled = !enabled);
    }

    function addRobinPeriod() {
      const start = document.getElementById('period-start').value;
      const end = document.getElementById('period-end').value;
      const type = document.querySelector('input[name="period-type"]:checked').value;

      if (!start || !end) {
        alert("Veuillez sélectionner une date de début et de fin.");
        return;
      }

      if (start > end) {
        alert("La date de début doit être antérieure à la date de fin.");
        return;
      }

      robinConfig.customPeriods.push({
        id: Date.now(),
        start: start,
        end: end,
        type: type
      });

      document.getElementById('period-start').value = '';
      document.getElementById('period-end').value = '';
      renderPeriodsList();
    }

    function removeRobinPeriod(id) {
      robinConfig.customPeriods = robinConfig.customPeriods.filter(p => p.id !== id);
      renderPeriodsList();
    }

    function renderPeriodsList() {
      const container = document.getElementById('robin-periods-list');
      container.innerHTML = '';

      if (robinConfig.customPeriods.length === 0) {
        container.innerHTML = '<span style="font-size: 0.75rem; color: var(--text-muted);">Aucune période d\'exception ajoutée.</span>';
        return;
      }

      robinConfig.customPeriods.forEach(p => {
        const item = document.createElement('div');
        item.style.cssText = 'display: flex; justify-content: space-between; align-items: center; background: #141414; border: 1px solid #333; padding: 6px 10px; border-radius: 4px; font-size: 0.8rem;';
        
        const badgeColor = p.type === 'presence' ? '#22c55e' : '#ef4444';
        const badgeText = p.type === 'presence' ? 'Présence' : 'Absence';

        item.innerHTML = `
          <span>Du <b>${p.start}</b> au <b>${p.end}</b></span>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="color: ${badgeColor}; font-weight: 700; font-size: 0.75rem;">${badgeText}</span>
            <button onclick="removeRobinPeriod(${p.id})" style="background: none; border: none; color: #888; cursor: pointer;">✕</button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function saveRobinSettings() {
      robinConfig.enableAlternate = document.getElementById('robin-enable-alternate').checked;
      robinConfig.parity = document.querySelector('input[name="robin-parity"]:checked').value;
      
      closeRobinSettings();
      
      if (typeof updateCalendarDisplay === 'function') {
        updateCalendarDisplay();
      }
    }
  </script>
</body>
</html>
