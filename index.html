<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning & Congés</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --we-robin: #fef08a;
      --ferie: #fca5a5;
      --vacances: #bfdbfe;
      --cp: #86efac;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 { margin: 0; font-size: 1.5rem; }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    button:hover { opacity: 0.9; }

    .legend {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      background: var(--card-bg);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.875rem;
    }

    .color-box {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1px solid rgba(0,0,0,0.1);
    }

    /* Grille Annuelle (12 Mois) */
    .year-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    .month-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    .month-title {
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
      text-transform: capitalize;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      font-size: 0.8rem;
    }

    .day-header {
      font-weight: bold;
      color: #64748b;
      padding: 4px 0;
    }

    .day-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid transparent;
      user-select: none;
    }

    .day-cell:hover {
      border-color: var(--primary);
    }

    .day-cell.empty {
      cursor: default;
      background: transparent !important;
    }

    /* Styles des jours */
    .type-we-robin { background-color: var(--we-robin); }
    .type-ferie { background-color: var(--ferie); }
    .type-vacances { background-color: var(--vacances); }
    .type-cp { background-color: var(--cp); font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1 id="year-title">Calendrier Annuel</h1>
    <div class="controls">
      <button onclick="changeYear(-1)">← Année précédente</button>
      <span id="current-year-display" style="font-weight:bold;">2026</span>
      <button onclick="changeYear(1)">Année suivante →</button>
    </div>
  </header>

  <div class="legend">
    <div class="legend-item"><div class="color-box" style="background: var(--we-robin);"></div> Garde / WE</div>
    <div class="legend-item"><div class="color-box" style="background: var(--ferie);"></div> Jours Fériés</div>
    <div class="legend-item"><div class="color-box" style="background: var(--vacances);"></div> Vacances Scolaires</div>
    <div class="legend-item"><div class="color-box" style="background: var(--cp);"></div> Congés Posés (CP)</div>
  </div>

  <div class="year-grid" id="calendar-container"></div>
</div>

<script>
  let currentYear = new Date().getFullYear();
  const monthsNames = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
  const daysNames = ["L", "M", "M", "J", "V", "S", "D"];

  // Chargement des données CP enregistrées localement dans le navigateur
  let userCP = JSON.parse(localStorage.getItem('user_cp_dates') || "[]");

  function saveCP() {
    localStorage.setItem('user_cp_dates', JSON.stringify(userCP));
  }

  function changeYear(offset) {
    currentYear += offset;
    renderCalendar();
  }

  function toggleCP(dateStr) {
    const idx = userCP.indexOf(dateStr);
    if (idx > -1) {
      userCP.splice(idx, 1);
    } else {
      userCP.push(dateStr);
    }
    saveCP();
    renderCalendar();
  }

  function renderCalendar() {
    document.getElementById('current-year-display').innerText = currentYear;
    document.getElementById('year-title').innerText = `Planning Annuel ${currentYear}`;
    
    const container = document.getElementById('calendar-container');
    container.innerHTML = '';

    // Génération des 12 mois
    for (let month = 0; month < 12; month++) {
      const monthCard = document.createElement('div');
      monthCard.className = 'month-card';

      const title = document.createElement('div');
      title.className = 'month-title';
      title.innerText = `${monthsNames[month]} ${currentYear}`;
      monthCard.appendChild(title);

      const daysGrid = document.createElement('div');
      daysGrid.className = 'days-grid';

      // En-têtes de jours
      daysNames.forEach(d => {
        const dh = document.createElement('div');
        dh.className = 'day-header';
        dh.innerText = d;
        daysGrid.appendChild(dh);
      });

      // Calcul du premier jour et du nombre de jours dans le mois
      const firstDayIdx = (new Date(currentYear, month, 1).getDay() + 6) % 7; // Lundi = 0
      const daysInMonth = new Date(currentYear, month + 1, 0).getDate();

      // Cases vides avant le 1er du mois
      for (let i = 0; i < firstDayIdx; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-cell empty';
        daysGrid.appendChild(emptyCell);
      }

      // Jours du mois
      for (let day = 1; day <= daysInMonth; day++) {
        const cell = document.createElement('div');
        cell.className = 'day-cell';
        cell.innerText = day;

        const dateFormatted = `${currentYear}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        
        // Application de la classe si le jour est posé en CP
        if (userCP.includes(dateFormatted)) {
          cell.classList.add('type-cp');
        }

        cell.onclick = () => toggleCP(dateFormatted);
        daysGrid.appendChild(cell);
      }

      monthCard.appendChild(daysGrid);
      container.appendChild(monthCard);
    }
  }

  // Initialisation au chargement
  renderCalendar();
</script>

</body>
</html>
