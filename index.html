<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des Congés</title>
  <style>
    :root {
      --bg-weekend: #e2e8f0;
      --text-weekend: #475569;
      --bg-ferie: #fef08a;
      --text-ferie: #854d0e;
      --bg-cp: #bfdbfe;
      --text-cp: #1e40af;
      --primary: #2563eb;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f8fafc;
      color: #0f172a;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }

    h1 {
      margin-top: 0;
      color: #1e293b;
    }

    /* Section Compteur CP */
    .cp-tracker {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      background: #f1f5f9;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 24px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group label {
      font-size: 0.875rem;
      font-weight: 600;
      color: #475569;
    }

    .input-group input {
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 1rem;
    }

    .balance-card {
      background: #ffffff;
      padding: 12px 16px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .balance-title {
      font-size: 0.875rem;
      color: #475569;
      font-weight: 600;
    }

    .balance-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
    }

    /* Légende */
    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.875rem;
    }

    .color-box {
      width: 20px;
      height: 20px;
      border-radius: 4px;
    }

    .box-weekend { background-color: var(--bg-weekend); border: 1px solid #cbd5e1; }
    .box-ferie { background-color: var(--bg-ferie); border: 1px solid #fde047; }
    .box-cp { background-color: var(--bg-cp); border: 1px solid #93c5fd; }

    /* Grille Calendrier */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .day-header {
      font-weight: 600;
      text-align: center;
      padding: 8px;
      background: #f1f5f9;
      border-radius: 4px;
      font-size: 0.875rem;
    }

    .day-cell {
      min-height: 60px;
      padding: 6px;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .day-number {
      font-weight: 600;
      font-size: 0.875rem;
    }

    .day-label {
      font-size: 0.75rem;
      font-weight: bold;
      align-self: flex-end;
    }

    /* Style des types de jours (Coloration complète de la case) */
    .day-cell.weekend {
      background-color: var(--bg-weekend) !important;
      color: var(--text-weekend);
    }

    .day-cell.ferie {
      background-color: var(--bg-ferie) !important;
      color: var(--text-ferie);
    }

    .day-cell.cp {
      background-color: var(--bg-cp) !important;
      color: var(--text-cp);
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Mes vacances</h1>

  <!-- Suivi des CP N-1 et CP N -->
  <div class="cp-tracker">
    <div class="input-group">
      <label for="cpN1">Solde CP N-1</label>
      <input type="number" id="cpN1" value="5" min="0" step="0.5" onchange="updateCounters()">
    </div>
    <div class="input-group">
      <label for="cpN">Solde CP N</label>
      <input type="number" id="cpN" value="25" min="0" step="0.5" onchange="updateCounters()">
    </div>
    <div class="balance-card">
      <span class="balance-title">CP Posés (décomptés)</span>
      <span class="balance-value" id="totalPose">0 j</span>
    </div>
    <div class="balance-card">
      <span class="balance-title">Solde CP Restant</span>
      <span class="balance-value" id="soldeRestant">30 j</span>
    </div>
  </div>

  <!-- Légende -->
  <div class="legend">
    <div class="legend-item">
      <div class="color-box box-weekend"></div>
      <span>Week-end Robin</span>
    </div>
    <div class="legend-item">
      <div class="color-box box-ferie"></div>
      <span>Jour férié</span>
    </div>
    <div class="legend-item">
      <div class="color-box box-cp"></div>
      <span>CP</span>
    </div>
  </div>

  <!-- Grille du Calendrier -->
  <div class="calendar-grid" id="calendar">
    <div class="day-header">Lun</div>
    <div class="day-header">Mar</div>
    <div class="day-header">Mer</div>
    <div class="day-header">Jeu</div>
    <div class="day-header">Ven</div>
    <div class="day-header">Sam</div>
    <div class="day-header">Dim</div>
    <!-- Les jours sont générés via JavaScript -->
  </div>
</div>

<script>
  // Simulation de jours de test
  const daysData = [
    { day: 1, isWeekend: false, isFerie: false },
    { day: 2, isWeekend: false, isFerie: false },
    { day: 3, isWeekend: false, isFerie: false },
    { day: 4, isWeekend: false, isFerie: false },
    { day: 5, isWeekend: false, isFerie: false },
    { day: 6, isWeekend: true,  isFerie: false },
    { day: 7, isWeekend: true,  isFerie: false },
    { day: 8, isWeekend: false, isFerie: false },
    { day: 9, isWeekend: false, isFerie: false },
    { day: 10, isWeekend: false, isFerie: false },
    { day: 11, isWeekend: false, isFerie: false },
    { day: 12, isWeekend: false, isFerie: false },
    { day: 13, isWeekend: true,  isFerie: false },
    { day: 14, isWeekend: true,  isFerie: false },
    { day: 15, isWeekend: false, isFerie: true }, // 15 Jour Férié
    { day: 16, isWeekend: false, isFerie: false },
    { day: 17, isWeekend: false, isFerie: false },
    { day: 18, isWeekend: false, isFerie: false },
    { day: 19, isWeekend: false, isFerie: false },
    { day: 20, isWeekend: true,  isFerie: false },
    { day: 21, isWeekend: true,  isFerie: false },
  ];

  const state = {};

  function renderCalendar() {
    const grid = document.getElementById('calendar');
    
    daysData.forEach(item => {
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      cell.dataset.day = item.day;
      
      if (item.isWeekend) cell.classList.add('weekend');
      if (item.isFerie) cell.classList.add('ferie');

      cell.innerHTML = `
        <span class="day-number">${item.day}</span>
        <span class="day-label" id="label-${item.day}"></span>
      `;

      cell.onclick = () => toggleCP(item);
      grid.appendChild(cell);
    });
  }

  function toggleCP(item) {
    const day = item.day;
    state[day] = !state[day];
    
    const cell = document.querySelector(`[data-day="${day}"]`);
    const label = document.getElementById(`label-${day}`);

    if (state[day]) {
      cell.classList.add('cp');
      label.textContent = 'CP';
    } else {
      cell.classList.remove('cp');
      label.textContent = '';
    }

    updateCounters();
  }

  function updateCounters() {
    const cpN1 = parseFloat(document.getElementById('cpN1').value) || 0;
    const cpN = parseFloat(document.getElementById('cpN').value) || 0;
    const totalInitial = cpN1 + cpN;

    let decompteCP = 0;

    daysData.forEach(item => {
      if (state[item.day]) {
        // Seuls les jours ouvrés (ni week-end ni fériés) décomptent des CP
        if (!item.isWeekend && !item.isFerie) {
          decompteCP += 1;
        }
      }
    });

    const soldeRestant = totalInitial - decompteCP;

    document.getElementById('totalPose').textContent = `${decompteCP} j`;
    document.getElementById('soldeRestant').textContent = `${soldeRestant} j`;
  }

  // Initialisation
  renderCalendar();
  updateCounters();
</script>

</body>
</html>
