<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificateur de Vacances & Garde</title>
  <style>
    :root {
      --bg-main: #0d1117;
      --bg-card: #161b22;
      --bg-panel: #21262d;
      --border: #30363d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #ff8c00;
      
      --color-weekend: #1c2128;
      --color-ferie: #702a00;
      --color-vacances-zoneB: #0d3868;
      --color-conge: #1f6beb;
      --color-garde: #e3b341;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 { font-size: 1.4rem; color: #fff; }

    /* Controls & Options Bar */
    .toolbar {
      display: flex;
      gap: 15px;
      background: var(--bg-card);
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }

    input[type="checkbox"] {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .btn {
      background: var(--bg-panel);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    .btn:hover { background: #30363d; }
    .btn-accent { background: var(--accent); color: #000; font-weight: 600; border: none; }

    /* Legend */
    .legend {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      font-size: 0.8rem;
      margin-bottom: 15px;
      background: var(--bg-card);
      padding: 10px 15px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-box { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--border); }

    /* Calendar Grid */
    .calendar-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .month-title { font-size: 1.2rem; font-weight: 700; color: #fff; text-transform: capitalize; }

    .grid-weekdays, .grid-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .weekday {
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      padding: 6px 0;
    }

    .day {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      min-height: 85px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.15s, transform 0.1s;
      position: relative;
    }

    .day:hover { border-color: var(--accent); }
    .day.empty { background: transparent; border-color: transparent; cursor: default; }

    .day-number { font-size: 0.85rem; font-weight: 700; }
    .day-label { font-size: 0.65rem; font-weight: 600; border-radius: 3px; padding: 2px 4px; text-align: center; line-height: 1.1; margin-top: 2px; }

    /* Distinctive States */
    .day.is-weekend { background: var(--color-weekend); }
    .day.is-ferie { background: var(--color-ferie); }
    .day.is-vacances { border-left: 4px solid #388bfd; background: linear-gradient(135deg, var(--color-vacances-zoneB) 0%, var(--bg-panel) 100%); }
    .day.is-conge { background: var(--color-conge) !important; color: #fff; }
    .day.is-garde-we { border: 2px solid var(--color-garde); }

    .badge-conge { background: #fff; color: var(--color-conge); }
    .badge-garde { background: var(--color-garde); color: #000; }
    .badge-ferie { background: #ff7b72; color: #000; }

    /* Counter Footer */
    .counter-bar {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 15px;
      border-radius: 8px;
    }

    .stat-number { font-size: 1.2rem; font-weight: 700; color: var(--accent); }
  </style>
</head>
<body>

  <header>
    <h1>🌴 Planificateur de Vacances & Garde (Zone B)</h1>
    <div style="display: flex; gap: 10px;">
      <button class="btn" onclick="exportData()">💾 Exporter</button>
      <button class="btn" onclick="importData()">📂 Importer</button>
    </div>
  </header>

  <!-- Options et Filtres -->
  <div class="toolbar">
    <div class="toolbar-group">
      <input type="checkbox" id="toggleGarde" onchange="renderCalendar()" checked>
      <label for="toggleGarde">Afficher garde Robin (1 WE / 2)</label>
    </div>

    <div class="toolbar-group" id="gardeParityGroup">
      <span>Weekend :</span>
      <select id="selectParity" onchange="renderCalendar()" class="btn">
        <option value="even" selected>Semaines Paires</option>
        <option value="odd">Semaines Impaires</option>
      </select>
    </div>

    <div class="toolbar-group">
      <input type="checkbox" id="toggleVacances" onchange="renderCalendar()" checked>
      <label for="toggleVacances">Afficher vacances scolaires (Zone B)</label>
    </div>
  </div>

  <!-- Légende -->
  <div class="legend">
    <div class="legend-item"><div class="legend-box" style="background: var(--color-weekend);"></div> Week-end</div>
    <div class="legend-item"><div class="legend-box" style="background: var(--color-ferie);"></div> Jour Férié</div>
    <div class="legend-item"><div class="legend-box" style="background: var(--color-vacances-zoneB);"></div> Vacances Zone B</div>
    <div class="legend-item"><div class="legend-box" style="border: 2px solid var(--color-garde);"></div> Garde Robin</div>
    <div class="legend-item"><div class="legend-box" style="background: var(--color-conge);"></div> Congé Pose (Cliquable)</div>
  </div>

  <!-- Calendrier -->
  <main class="calendar-card">
    <div class="calendar-header">
      <button class="btn" onclick="changeMonth(-1)">◄ Mois précédent</button>
      <span id="monthDisplay" class="month-title">---</span>
      <button class="btn" onclick="changeMonth(1)">Mois suivant ►</button>
    </div>

    <div class="grid-weekdays">
      <div class="weekday">Lun</div><div class="weekday">Mar</div><div class="weekday">Mer</div>
      <div class="weekday">Jeu</div><div class="weekday">Ven</div><div class="weekday">Sam</div>
      <div class="weekday">Dim</div>
    </div>

    <div id="calendarGrid" class="grid-days" style="margin-top: 8px;"></div>
  </main>

  <!-- Total Congés -->
  <div class="counter-bar">
    <span>Jours de congés posés sur le mois sélectionné :</span>
    <span id="congesMonthCount" class="stat-number">0 jour(s)</span>
  </div>

  <script>
    let currentDate = new Date();
    let congesPoses = JSON.parse(localStorage.getItem('my_conges_data')) || [];

    // Jours fériés fixes & calculables
    function getJoursFeries(year) {
      const feries = [
        `${year}-01-01`, `${year}-05-01`, `${year}-05-08`, `${year}-07-14`,
        `${year}-08-15`, `${year}-11-01`, `${year}-11-11`, `${year}-12-25`
      ];
      // Pâques & Ascension / Pentecôte
      const a = year % 19, b = Math.floor(year / 100), c = year % 100;
      const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
      const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
      const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
      const m = Math.floor((a + 11 * h + 22 * l) / 451);
      const month = Math.floor((h + l - 7 * m + 114) / 31) - 1;
      const day = ((h + l - 7 * m + 114) % 31) + 1;
      
      const paques = new Date(year, month, day);
      const lundiPaques = new Date(paques); lundiPaques.setDate(paques.getDate() + 1);
      const ascension = new Date(paques); ascension.setDate(paques.getDate() + 39);
      const lundiPentecote = new Date(paques); lundiPentecote.setDate(paques.getDate() + 50);

      const fmt = d => d.toISOString().split('T')[0];
      return [...feries, fmt(lundiPaques), fmt(ascension), fmt(lundiPentecote)];
    }

    // Vacances Scolaires Zone B (Exemple d'intervalles 2026/2027)
    const vacancesZoneB = [
      { start: "2026-02-07", end: "2026-02-23", label: "Hiver" },
      { start: "2026-04-04", end: "2026-04-20", label: "Printemps" },
      { start: "2026-07-04", end: "2026-08-31", label: "Été" },
      { start: "2026-10-17", end: "2026-11-02", label: "Toussaint" },
      { start: "2026-12-19", end: "2027-01-04", label: "Noël" }
    ];

    function getISOWeekNumber(d) {
      const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const dayNum = date.getUTCDay() || 7;
      date.setUTCDate(date.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
      return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
    }

    function toggleConges(dateStr) {
      if (congesPoses.includes(dateStr)) {
        congesPoses = congesPoses.filter(d => d !== dateStr);
      } else {
        congesPoses.push(dateStr);
      }
      localStorage.setItem('my_conges_data', JSON.stringify(congesPoses));
      renderCalendar();
    }

    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const monthNames = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
      document.getElementById('monthDisplay').innerText = `${monthNames[month]}${year}`;

      const feries = getJoursFeries(year);
      const showGarde = document.getElementById('toggleGarde').checked;
      const parity = document.getElementById('selectParity').value;
      const showVacances = document.getElementById('toggleVacances').checked;

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);

      let startDayIndex = firstDay.getDay() - 1;
      if (startDayIndex === -1) startDayIndex = 6;

      for (let i = 0; i < startDayIndex; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day empty';
        grid.appendChild(emptyCell);
      }

      let monthCongesCount = 0;

      for (let day = 1; day <= lastDay.getDate(); day++) {
        const dateObj = new Date(year, month, day);
        const dayOfWeek = dateObj.getDay(); // 0 = Dim, 6 = Sam
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const weekNum = getISOWeekNumber(dateObj);
        const isEven = weekNum % 2 === 0;

        const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
        const isFerie = feries.includes(dateStr);
        const isConge = congesPoses.includes(dateStr);

        let isVacances = false;
        if (showVacances) {
          isVacances = vacancesZoneB.some(v => dateStr >= v.start && dateStr <= v.end);
        }

        let isGarde = false;
        if (showGarde && isWeekend) {
          if ((parity === 'even' && isEven) || (parity === 'odd' && !isEven)) {
            isGarde = true;
          }
        }

        const cell = document.createElement('div');
        cell.className = 'day';
        if (isWeekend) cell.classList.add('is-weekend');
        if (isFerie) cell.classList.add('is-ferie');
        if (isVacances) cell.classList.add('is-vacances');
        if (isGarde) cell.classList.add('is-garde-we');
        if (isConge) {
          cell.classList.add('is-conge');
          if (!isWeekend && !isFerie) monthCongesCount++;
        }

        cell.onclick = () => toggleConges(dateStr);

        let labelsHTML = '';
        if (isConge) labelsHTML += `<span class="day-label badge-conge">Congé</span>`;
        if (isFerie) labelsHTML += `<span class="day-label badge-ferie">Férié</span>`;
        if (isGarde) labelsHTML += `<span class="day-label badge-garde">Robin</span>`;

        cell.innerHTML = `
          <span class="day-number">${day}</span>
          <div style="display:flex; flex-direction:column; gap:2px;">${labelsHTML}</div>
        `;

        grid.appendChild(cell);
      }

      document.getElementById('congesMonthCount').innerText = `${monthCongesCount} jour(s) ouvré(s)`;
    }

    function changeMonth(offset) {
      currentDate.setMonth(currentDate.getMonth() + offset);
      renderCalendar();
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(congesPoses));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "mes_vacances.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.readAsText(file, 'UTF-8');
        reader.onload = readerEvent => {
          try {
            congesPoses = JSON.parse(readerEvent.target.result);
            localStorage.setItem('my_conges_data', JSON.stringify(congesPoses));
            renderCalendar();
          } catch(err) {
            alert("Fichier JSON invalide.");
          }
        }
      }
      input.click();
    }

    window.onload = renderCalendar;
  </script>
</body>
</html>
